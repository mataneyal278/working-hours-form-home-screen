<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>חישוב חשמל לדיירים</title>
    <meta name="description" content="צילום מונים, חישוב חשמל והכנת חשבונות לדיירים">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="חישוב חשמל">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="חישוב חשמל">
    <meta name="theme-color" content="#f7f7f4">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=6">
    <link rel="icon" type="image/png" sizes="192x192" href="./favicon-192.png?v=6">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=6">
    <link rel="shortcut icon" type="image/png" href="./favicon-32.png?v=6">
    <link rel="manifest" href="./manifest.webmanifest?v=6">
    <link rel="preconnect" href="https://script.google.com">
    <link rel="preconnect" href="https://script.googleusercontent.com">
    <meta property="og:title" content="חישוב חשמל לדיירים">
    <meta property="og:image" content="./apple-touch-icon.png?v=6">
    <style>
      html,
      body,
      iframe {
        height: 100%;
        margin: 0;
        width: 100%;
      }

      body {
        background: #f7f7f4;
        overflow: hidden;
      }

      iframe {
        border: 0;
        display: block;
      }

      .form-loader {
        align-items: center;
        background: #f4f7fb;
        display: flex;
        flex-direction: column;
        gap: 18px;
        inset: 0;
        justify-content: center;
        opacity: 0;
        padding:
          max(24px, env(safe-area-inset-top))
          24px
          max(24px, env(safe-area-inset-bottom));
        position: fixed;
        transition: opacity 180ms ease, visibility 180ms ease;
        visibility: hidden;
        z-index: 10;
      }

      .form-loader.visible {
        opacity: 1;
        visibility: visible;
      }

      .tower-mark {
        animation: tower-breathe 1.45s ease-in-out infinite;
        height: min(52vw, 210px);
        width: min(52vw, 210px);
      }

      .tower-mark img {
        height: 100%;
        object-fit: contain;
        width: 100%;
      }

      .form-loader strong {
        color: #1f2933;
        font: 700 20px Arial, "Noto Sans Hebrew", sans-serif;
      }

      .form-loader span {
        color: #66727d;
        font: 14px Arial, "Noto Sans Hebrew", sans-serif;
      }

      @keyframes tower-breathe {
        0%, 100% { transform: scale(0.84); }
        50% { transform: scale(1.08); }
      }

      @media (prefers-reduced-motion: reduce) {
        .tower-mark { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="formLoader" class="form-loader" aria-hidden="true">
      <div class="tower-mark" aria-hidden="true">
        <img src="./loader-water-tower.png?v=6" alt="">
      </div>
      <strong>חישוב חשמל לדיירים</strong>
      <span>טוען את האפליקציה…</span>
    </div>

    <script>
      const formLoader = document.getElementById('formLoader');
      let formLoaded = false;

      const loaderDelay = window.setTimeout(() => {
        if (!formLoaded) formLoader.classList.add('visible');
      }, 450);

      const loaderFailsafe = window.setTimeout(() => {
        window.__electricityFrameLoaded();
      }, 8000);

      window.__electricityFrameLoaded = () => {
        formLoaded = true;
        window.clearTimeout(loaderDelay);
        window.clearTimeout(loaderFailsafe);
        formLoader.classList.remove('visible');
      };
    </script>

    <iframe
      id="electricityFrame"
      title="חישוב חשמל לדיירים"
      src="https://script.google.com/macros/s/AKfycbzMxvDb0dUq915mtkGmS86qrpvj9sMlx1oZbSLpwIp4khS3okg_TujSsyqjfADK7SSN/exec"
      allow="clipboard-write"
      onload="window.__electricityFrameLoaded()"
    ></iframe>
  </body>
</html>
